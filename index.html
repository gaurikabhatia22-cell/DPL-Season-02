<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPL — Season 02</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at 50% 35%, #1d4a36 0%, #0d2b20 35%, #061812 75%);
        color: #f3e8cd;
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .screen {
        width: 100%;
        min-height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        overflow: hidden;
    }

    /* subtle broadcast grid */
    .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image:
            linear-gradient(rgba(243,232,205,0.4) 1px, transparent 1px),
            linear-gradient(90deg, rgba(243,232,205,0.4) 1px, transparent 1px);
        background-size: 70px 70px;
        pointer-events: none;
    }

    .topbar {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(243,232,205,0.25);
        padding-bottom: 14px;
        font-size: 11px;
        letter-spacing: 2px;
        color: #bcae91;
    }

    .live {
        color: #f3e8cd;
    }

    .live::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #f3e8cd;
        border-radius: 50%;
        margin-right: 8px;
    }

    .main {
        position: relative;
        z-index: 2;
        text-align: center;
        margin: auto;
    }

    .eyebrow {
        font-size: 11px;
        letter-spacing: 5px;
        color: #bcae91;
        margin-bottom: 22px;
        text-transform: uppercase;
    }

    .dpl {
        font-size: clamp(85px, 23vw, 190px);
        line-height: 0.75;
        font-weight: 900;
        letter-spacing: -10px;
        color: #f3e8cd;
    }

    .season {
        margin-top: 28px;
        font-size: clamp(28px, 7vw, 58px);
        font-weight: 800;
        letter-spacing: 8px;
    }

    .league {
        margin-top: 12px;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 18px;
        letter-spacing: 3px;
        color: #bcae91;
    }

    .status {
        margin-top: 52px;
        font-size: 11px;
        letter-spacing: 3px;
        color: #bcae91;
    }

    .status span {
        color: #f3e8cd;
    }

    .enter {
        margin-top: 28px;
        padding: 15px 38px;
        border: 1px solid rgba(243,232,205,0.55);
        background: transparent;
        color: #f3e8cd;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 3px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .enter:hover {
        background: #f3e8cd;
        color: #0b241b;
        transform: translateY(-2px);
    }

    .bottom {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid rgba(243,232,205,0.25);
        padding-top: 14px;
        font-size: 10px;
        letter-spacing: 2px;
        color: #8f846e;
    }

    @media (max-width: 600px) {
        .screen {
            padding: 18px;
        }

        .topbar,
        .bottom {
            font-size: 8px;
        }

        .dpl {
            letter-spacing: -6px;
        }

        .season {
            letter-spacing: 5px;
        }
    }
</style>
</head>

<body>

<div class="screen">

    <div class="topbar">
        <div class="live">LIVE BROADCAST</div>
        <div>DPL // 2026</div>
    </div>

    <main class="main">

        <div class="eyebrow">
            Player Database
        </div>

        <div class="dpl">
            DPL
        </div>

        <div class="season">
            SEASON 02
        </div>

        <div class="league">
            Dave Premier League
        </div>

        <div class="status">
            ARCHIVE STATUS:
            <span>ACTIVE</span>
        </div>

        <button class="enter" onclick="enterLeague()">
            ENTER
        </button>

    </main>

    <div class="bottom">
        <div>PLAYER DATABASE // RESTRICTED</div>
        <div>EST. 2024</div>
    </div>

</div>

<script>
function enterLeague() {
    alert("PLAYER PROFILE: DEV\n\nSeason 02 access granted.");
}
</script>

</body>
</html>
